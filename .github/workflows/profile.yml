name: Render profile
on:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/render_profile.py
      - scripts/test_profile.py
      - assets/icons/**
      - .github/workflows/profile.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-profile
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Render artwork and links
        run: python3 scripts/render_profile.py
      - name: Save generated profile
        run: |
          git add README.md assets/current-project*.svg assets/project-releases*.svg assets/tools-panel*.svg assets/profile-focus*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render profile from profile.json'
          git push origin HEAD:main
