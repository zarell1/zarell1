<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ZARELL1 automation lab</title>
  <desc id="desc">Animated amber CRT-style automation lab with a hooded operator, workflow console, terminal log and timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080a0a"/><stop offset="1" stop-color="#151108"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4a916"/><stop offset=".48" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb51f"/></linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H8" stroke="#ffc447" stroke-opacity=".12"/></pattern>
    <pattern id="microgrid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#ffb52e" stroke-opacity=".09"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="consolePath" d="M316 477H405C426 477 426 450 451 450H546C568 450 568 477 591 477H659C681 477 681 450 705 450H781" fill="none"/>
    <style>
      .pixel{shape-rendering:crispEdges}.mono{font-family:"Courier New",monospace;letter-spacing:1px}.amber{fill:#ffc447}.pale{fill:#f1ddb0}.dim{fill:#887246}.line{stroke:#ffb51f;stroke-width:2;fill:none}.thin{stroke:#815f1e;stroke-width:1;fill:none}
      .flicker{animation:flicker 3.2s steps(2,end) infinite}.pulse{animation:pulse 1.7s steps(2,end) infinite}.blink{animation:blink 1s steps(2,end) infinite}.float{animation:float 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sway{animation:sway 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
      @keyframes flicker{0%,91%,100%{opacity:1}92%{opacity:.38}94%{opacity:.9}96%{opacity:.5}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.15}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
    </style>
  </defs>

