<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">ZARELL1 automation lab</title>
  <desc id="desc">Detailed amber CRT automation lab artwork with subtle live workflow animation.</desc>
  <defs>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H1672" stroke="#ffd36a" stroke-opacity=".16" stroke-width="1"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="workflowPath" d="M428 583H570C602 583 602 566 636 566H757C791 566 791 583 822 583H972C1006 583 1006 566 1038 566H1170" fill="none"/>
    <style>
      .pulse{animation:pulse 1.7s steps(2,end) infinite}.blink{animation:blink 1s steps(2,end) infinite}.flicker{animation:flicker 4s steps(2,end) infinite}.scan{animation:scan 7s linear infinite}.float{animation:float 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sway{animation:sway 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.rotate{animation:rotate 3.8s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}@keyframes blink{0%,46%{opacity:1}47%,100%{opacity:.08}}@keyframes flicker{0%,90%,100%{opacity:.08}92%{opacity:.28}94%{opacity:.04}}@keyframes scan{from{transform:translateY(-941px)}to{transform:translateY(941px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg)}}@keyframes rotate{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect width="1672" height="941" fill="#07090b"/>
  <image x="0" y="0" width="1672" height="941" preserveAspectRatio="none" href="https://raw.githubusercontent.com/zarell1/zarell1/main/automation-lab.png" xlink:href="https://raw.githubusercontent.com/zarell1/zarell1/main/automation-lab.png"/>

  <!-- animated phosphor layer -->
  <g pointer-events="none">
    <rect width="1672" height="941" fill="url(#scanlines)" opacity=".2" class="scan"/>
    <rect width="1672" height="941" fill="#ffb51f" opacity=".035" class="flicker"/>

    <!-- moving workflow signal -->
    <path d="M428 583H570C602 583 602 566 636 566H757C791 566 791 583 822 583H972C1006 583 1006 566 1038 566H1170" fill="none" stroke="#ffbf32" stroke-width="2" opacity=".35"/>
    <g filter="url(#glow)"><circle r="7" fill="#fff0a6" class="pulse"><animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#workflowPath"/></animateMotion></circle><circle r="4" fill="#ff9c15"><animateMotion dur="3.2s" begin="1.06s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#workflowPath"/></animateMotion></circle></g>

    <!-- rotating gear highlight over the raster gear -->
    <g transform="translate(706 583)" opacity=".72" filter="url(#softGlow)"><g class="rotate"><path d="M0-34L8-27L21-30L24-17L35-10L28 0L35 10L24 17L21 30L8 27L0 35L-8 27L-21 30L-24 17L-35 10L-28 0L-35-10L-24-17L-21-30L-8-27Z" fill="none" stroke="#ffd15a" stroke-width="3"/><circle r="13" fill="none" stroke="#fff0a6" stroke-width="2"/></g></g>

    <!-- living indicator lights and terminal cursor -->
    <g class="pulse" filter="url(#glow)"><circle cx="624" cy="583" r="5" fill="#fff0a6"/><circle cx="821" cy="583" r="5" fill="#fff0a6"/><circle cx="1004" cy="583" r="5" fill="#fff0a6"/></g>
    <rect x="1381" y="666" width="10" height="17" fill="#ffc447" class="blink"/>
    <rect x="713" y="419" width="12" height="18" fill="#ffc447" class="blink" opacity=".75"/>

    <!-- subtle idle motion on the foreground operators -->
    <g class="float" opacity=".24"><path d="M174 671h214" stroke="#ffc447" stroke-width="3"/><path d="M184 676h192" stroke="#fff0a6" stroke-opacity=".5"/></g>
    <g class="sway" opacity=".17"><path d="M1510 396c-8-34-1-59 12-80M1512 365c-21-14-29-28-31-42M1515 347c21-12 29-25 34-42" fill="none" stroke="#ffc447" stroke-width="3"/></g>

    <!-- animated CRT vignette and frame glint -->
    <rect x="20" y="14" width="1632" height="913" rx="7" fill="none" stroke="#ffe08a" stroke-opacity=".24"/>
    <path d="M40 16H1600" stroke="#fff0a6" stroke-opacity=".2" stroke-width="2" class="flicker"/>
  </g>
</svg>

